name: zuraffa_permissions_macos
description: The iOS implementation of zuraffa_permissions (AVFoundation/Photos/CoreLocation/UNUserNotificationCenter).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_permissions
    platforms:
      ios:
        pluginClass: ZuraffaPermissionsPlugin
        dartPluginClass: ZuraffaPermissionsMacOS

dependencies:
  flutter:
    sdk: flutter
  zuraffa_permissions_platform_interface:
    path: ../zuraffa_permissions_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
