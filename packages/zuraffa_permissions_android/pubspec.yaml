name: zuraffa_permissions_android
description: >-
  The Android implementation of zuraffa_permissions (ActivityCompat-based)
  covering camera, microphone, location, contacts, notifications, and more.
version: 7.4.1
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_permissions
    platforms:
      android:
        package: com.zuraffa.permissions
        pluginClass: ZuraffaPermissionsPlugin
        dartPluginClass: ZuraffaPermissionsAndroid

dependencies:
  flutter:
    sdk: flutter
  zuraffa_permissions: ^7.4.1
  zuraffa_permissions_platform_interface: ^7.4.1

dependency_overrides:
  # Fleet-wide xml policy: pin the override to the latest xml so graphs
  # that still transitively pull the abandoned minio (xml 6.x) resolve
  # cleanly. No sibling path stanzas — they poison the published archive
  # (pub does NOT strip overrides); local dev resolution rides a
  # gitignored pubspec_overrides.yaml.
  xml: 7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - permissions
  - android
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_permissions
issue_tracker: https://github.com/arrrrny/zuraffa_permissions/issues
