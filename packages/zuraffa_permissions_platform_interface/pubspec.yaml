name: zuraffa_permissions_platform_interface
description: >-
  The platform interface contract for zuraffa_permissions: the
  MethodChannel protocol and the PermissionPort bridge platform
  implementations conform to.
version: 7.3.7
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  zuraffa_permissions: ^7.3.7

dependency_overrides:
  # Fleet-wide xml policy: pin the override to the latest xml so graphs
  # that still transitively pull the abandoned minio (xml 6.x) resolve
  # cleanly. No sibling path stanzas — they poison the published archive
  # (pub does NOT strip overrides); local dev resolution rides a
  # gitignored pubspec_overrides.yaml.
  xml: 7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - permissions
  - platform-interface
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_permissions
issue_tracker: https://github.com/arrrrny/zuraffa_permissions/issues
