name: zuraffa_permissions_ios
description: >-
  The iOS implementation of zuraffa_permissions (AVFoundation, Photos,
  CoreLocation, UNUserNotificationCenter) across the eleven built-in scopes.
version: 7.3.2
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_permissions
    platforms:
      ios:
        pluginClass: ZuraffaPermissionsPlugin
        dartPluginClass: ZuraffaPermissionsIOS

dependencies:
  flutter:
    sdk: flutter
  zuraffa_permissions: ^7.3.2
  zuraffa_permissions_platform_interface: ^7.3.2

dependency_overrides:
  zuraffa_permissions:
    path: ../zuraffa_permissions
  zuraffa_permissions_platform_interface:
    path: ../zuraffa_permissions_platform_interface

  xml: 7.1.0
  zuraffa:
    path: ../../../zuraffa
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - permissions
  - ios
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_permissions
issue_tracker: https://github.com/arrrrny/zuraffa_permissions/issues
