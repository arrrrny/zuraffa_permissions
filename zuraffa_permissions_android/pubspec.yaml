name: zuraffa_permissions_android
description: >-
  The Android implementation of zuraffa_permissions (ActivityCompat-based)
  covering camera, microphone, location, contacts, notifications, and more.
version: 0.1.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_permissions
issue_tracker: https://github.com/arrrrny/zuraffa_permissions/issues
topics:
  - permissions
  - zuraffa
  - android

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_permissions
    platforms:
      android:
        package: com.zuraffa.permissions
        pluginClass: ZuraffaPermissionsPlugin
        dartPluginClass: ZuraffaPermissionsAndroid

dependencies:
  flutter:
    sdk: flutter
  zuraffa_permissions: ^0.1.0
  zuraffa_permissions_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
