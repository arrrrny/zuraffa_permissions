name: zuraffa_permissions_ios
description: >-
  The iOS implementation of zuraffa_permissions (AVFoundation, Photos,
  CoreLocation, UNUserNotificationCenter) across the eleven built-in scopes.
version: 0.1.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_permissions
issue_tracker: https://github.com/arrrrny/zuraffa_permissions/issues
topics:
  - permissions
  - zuraffa
  - ios

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_permissions
    platforms:
      ios:
        pluginClass: ZuraffaPermissionsPlugin
        dartPluginClass: ZuraffaPermissionsIOS

dependencies:
  flutter:
    sdk: flutter
  zuraffa_permissions: ^0.1.0
  zuraffa_permissions_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
