name: zuraffa_permissions
description: >-
  Typed, Zuraffa-native permission requests for Android, iOS, and macOS:
  eleven built-in scopes, custom scopes, idempotent prompts, and GetIt DI.
version: 0.1.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_permissions
issue_tracker: https://github.com/arrrrny/zuraffa_permissions/issues
topics:
  - permissions
  - zuraffa
  - camera
  - location
  - clean-architecture

environment:
  sdk: ^3.11.0

dependencies:
  json_annotation: ^4.12.0
  zorphy_annotation: ^2.3.0
  zuraffa: ^6.1.0

dev_dependencies:
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  lints: ^4.0.0
  mutation_test: ^1.8.0
  test: ^1.24.0
